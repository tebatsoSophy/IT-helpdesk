spring:
  application:
    name: helpdesk
  datasource:
    # File-based H2 so data survives restarts. Use jdbc:h2:mem:helpdesk for a throwaway database.
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/helpdesk}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:true}
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update          # Fine for H2. Move to Flyway/Liquibase + "validate" for PostgreSQL.
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: 8080
  error:
    include-message: never

jwt:
  secret: ${JWT_SECRET:dev-only-secret-please-change-me-dev-only-secret-please-change-me}
  expiration: ${JWT_EXPIRATION:86400000}   # 24 hours

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  upload-dir: ${UPLOAD_DIR:./uploads}
  registration-enabled: ${REGISTRATION_ENABLED:true}
  mail:
    from: ${MAIL_FROM:helpdesk@company.local}
  seed:
    admin-email: ${ADMIN_EMAIL:admin@helpdesk.local}
    admin-password: ${ADMIN_PASSWORD:Admin123!}
    demo-data: ${SEED_DEMO_DATA:true}     # demo technicians, user and sample tickets. Set false in production.

# Email is only sent when spring.mail.host is set (e.g. SPRING_MAIL_HOST=smtp.example.com).
# Otherwise notifications are written to the log.

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.company.helpdesk: INFO
