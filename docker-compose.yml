# Starts the API (Spring Boot + H2) and the web app (nginx serving the React build).
# Web app: http://localhost:3000     API docs: http://localhost:8080/swagger-ui.html
services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string-of-at-least-32-characters}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@helpdesk.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin123!}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      H2_CONSOLE_ENABLED: ${H2_CONSOLE_ENABLED:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    volumes:
      - helpdesk-data:/app/data        # the H2 database file
      - helpdesk-uploads:/app/uploads  # ticket attachments
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  helpdesk-data:
  helpdesk-uploads:
